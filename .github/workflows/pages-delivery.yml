name: Published Pages delivery
on:
  pull_request:
    paths: ['tests/pages-delivery.mjs', '.github/workflows/pages-delivery.yml']
  workflow_dispatch:
  workflow_run:
    workflows: ['pages build and deployment', 'pages-build-deployment']
    types: [completed]
    branches: [main]
permissions:
  contents: read
  pages: read
jobs:
  verify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Identify published project and revision
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
          BUILT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          site=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .html_url)
          sha=${BUILT_SHA:-$(gh api "repos/$GITHUB_REPOSITORY/pages/builds" --jq '[.[] | select(.status == "built")][0].commit')}
          [[ $sha =~ ^[a-f0-9]{40}$ ]]
          echo "Comparing $site with $sha"
          echo "site=${site%/}/" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pages.outputs.sha }}
          path: deployed
          persist-credentials: false
      # A pull request that adds this checker can run before the site itself has
      # been deployed (the currently published revision may predate index.html).
      # There is nothing to compare in that case; the check runs on the next
      # successful Pages build, after the site has been published.
      - name: Check that the deployed revision contains the site
        id: deployed
        env:
          SHA: ${{ steps.pages.outputs.sha }}
        run: |
          if [[ ! -f deployed/index.html ]]; then
            echo "Published revision $SHA has no index.html; skipping delivery comparison until the site is deployed."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - run: node tests/pages-delivery.mjs deployed "$SITE"
        if: steps.deployed.outputs.skip != 'true'
        env:
          SITE: ${{ steps.pages.outputs.site }}
